name: Container image scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package jar
        run: ./mvnw -s settings.xml -DskipTests -DskipIntegration=true -DskipDependenciesCheck=true -DskipVerifications=true package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          # Prefer the Spring Boot repackaged jar; exclude sources/original
          JAR=$(ls target/boilerplate-*.jar | grep -v sources | grep -v original | head -1)
          docker build --build-arg JAR_FILE="$JAR" -t boilerplate:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: boilerplate:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
