name: Container image scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package jar
        run: mvn -s settings.xml -DskipTests -DskipIntegration=true package

      - name: Build image
        run: docker build -t boilerplate:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: boilerplate:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
