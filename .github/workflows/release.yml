name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build package
        run: mvn -s settings.xml clean package -DskipIntegration=true -DskipDependenciesCheck=true -DskipVerifications=true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/boilerplate-*.jar
          generate_release_notes: true
